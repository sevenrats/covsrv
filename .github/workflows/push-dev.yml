name: Post-PR (develop)

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sevenrats/covsrv

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv pip compile pyproject.toml -o requirements.txt
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: coverage run -m pytest

      - name: Coverage Report & Upload to covsrv
        uses: sevenrats/covsrv-actions-github@main
        with:
          coverage-token: ${{ secrets.COVSRV_TOKEN }}
          reports-endpoint-url: ${{ secrets.COVSRV_REPORT_URL }}

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
