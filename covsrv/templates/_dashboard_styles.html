<!-- Shared CSS for dashboard pages (branch + hash).
     Colors reference _theme.html custom-properties. -->
{% macro dashboard_css() %}
<style>
  .content {
    padding: 24px 40px;
  }

  .top {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  .pill {
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--clr-pill-bg);
    color: var(--clr-pill-text);
    font-size: 12px;
  }

  .pill a {
    color: var(--clr-accent);
  }

  .download-row {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .btn {
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--clr-btn-border);
    background: var(--clr-btn-bg);
    font-size: 12px;
    line-height: 1.2;
    text-decoration: none;
    transition: all 0.15s ease;
    color: var(--clr-text);
  }

  .btn:hover {
    background: var(--clr-btn-hover-bg);
    border-color: var(--clr-btn-hover-bdr);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    margin-top: 24px;
  }

  @media (min-width: 1000px) {
    .grid {
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
    }
  }

  .card {
    border: 1px solid var(--clr-border);
    border-radius: 18px;
    padding: 20px;
    background: var(--clr-surface);
    box-shadow: 0 1px 3px var(--clr-shadow);
  }

  .card h2 {
    margin: 0 0 16px 0;
    font-size: 18px;
    color: var(--clr-text);
  }

  .chart-box {
    height: var(--chart-h);
  }

  .chart-box canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  .uncovered-list {
    margin-top: 16px;
    padding-left: 20px;
    max-height: 160px;
    overflow-y: auto;
    font-size: 14px;
    color: var(--clr-text-muted);
  }

</style>
{% endmacro %}
