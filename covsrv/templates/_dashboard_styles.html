{#- Shared CSS for dashboard pages (branch + hash).

    Import:  {% from '_dashboard_styles.html' import dashboard_css %}
    Usage:   {{ dashboard_css() }}
-#}

{% macro dashboard_css() %}
<style>
  :root {
    --chart-h: 360px;
  }

  .content {
    padding: 24px 40px;
  }

  .top {
    display: flex;
    gap: 16px;
    align-items: baseline;
    flex-wrap: wrap;
  }

  .pill {
    padding: 6px 12px;
    border-radius: 999px;
    background: #f2f2f2;
    font-size: 14px;
  }

  .muted-row {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 14px;
    color: #666;
    font-size: 14px;
  }

  .btn {
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #e2e2e2;
    background: #fafafa;
    font-size: 12px;
    line-height: 1.2;
    text-decoration: none;
    transition: all 0.15s ease;
    color: #333;
  }

  .btn:hover {
    background: #f0f0f0;
    border-color: #d0d0d0;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    margin-top: 24px;
  }

  @media (min-width: 1000px) {
    .grid {
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
    }
  }

  .card {
    border: 1px solid #e7e7e7;
    border-radius: 18px;
    padding: 20px;
    background: white;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }

  .card h2 {
    margin: 0 0 16px 0;
    font-size: 18px;
  }

  .chart-box {
    height: var(--chart-h);
  }

  .chart-box canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  .uncovered-list {
    margin-top: 16px;
    padding-left: 20px;
    max-height: 160px;
    overflow-y: auto;
    font-size: 14px;
  }

  .gauge-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .gauge-value {
    font-size: 48px;
    font-weight: 700;
    line-height: 1;
  }

  .gauge-caption {
    font-size: 14px;
    color: #888;
    margin-top: 4px;
  }
</style>
{% endmacro %}
